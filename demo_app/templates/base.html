<!-- Shared layout for the Northwind Community Bank demo portal. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Northwind Community Bank{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='styles.css') }}"
    >
</head>

<body>

    <header class="top-bar">
        <div class="bank-name">Northwind Community Bank</div>
        <div class="system-name">Member Services Portal</div>
    </header>

    <main class="page">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        Internal training environment - synthetic member data only
    </footer>

</body>
</html>
