<!-- Collects basic details before a new account request is reviewed. -->

{% extends "base.html" %}

{% block title %}
Open New Account
{% endblock %}

{% block content %}

<div class="panel">

    <h1>Open New Account</h1>

    <p class="help-text">
        Enter the member and account details below.
    </p>

    <form method="post" action="/new-account/review">

        <div class="form-row">
            <label for="member_id">Member Number</label>
            <input
                type="text"
                id="member_id"
                name="member_id"
                required
            >
        </div>

        <div class="form-row">
            <label for="account_type">Account Type</label>

            <select
                id="account_type"
                name="account_type"
                required
            >
                <option value="">Select account type</option>
                <option value="Savings">Savings</option>
                <option value="Checking">Checking</option>
            </select>
        </div>

        <div class="form-row">
            <label for="opening_deposit">Opening Deposit</label>
            <input
                type="number"
                id="opening_deposit"
                name="opening_deposit"
                min="0"
                step="0.01"
                required
            >
        </div>

        <button type="submit">
            Continue to Review
        </button>

    </form>

</div>

{% endblock %}
